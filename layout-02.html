<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      overflow-x: hidden;
      padding: 10px;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .item {
      aspect-ratio: 16 / 9;
      width: 100%;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 600px) {
      .galeria {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 400px) {
      .galeria {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="galeria">
    <div class="item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6e6U04lyE1_CNFoRBO2I88VeixAXDw2Rb7ezdJlvnfQ&s=10" alt="IMG 1"></div>
    <div class="item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6e6U04lyE1_CNFoRBO2I88VeixAXDw2Rb7ezdJlvnfQ&s=10" alt="IMG 2"></div>
    <div class="item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6e6U04lyE1_CNFoRBO2I88VeixAXDw2Rb7ezdJlvnfQ&s=10" alt="IMG 3"></div>
    <div class="item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6e6U04lyE1_CNFoRBO2I88VeixAXDw2Rb7ezdJlvnfQ&s=10" alt="IMG 4"></div>
    <div class="item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6e6U04lyE1_CNFoRBO2I88VeixAXDw2Rb7ezdJlvnfQ&s=10" alt="IMG 5"></div>
    <div class="item"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6e6U04lyE1_CNFoRBO2I88VeixAXDw2Rb7ezdJlvnfQ&s=10" alt="IMG 6"></div>
  </div>

</body>
</html>
